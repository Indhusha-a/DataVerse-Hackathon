# Serves the built SPA and proxies the same two paths the Vite dev server
# proxies in local development, so the frontend works unchanged in Docker.
#
# proxy_pass targets are kept in variables and resolved through Docker's
# embedded DNS (127.0.0.11) at request time, not at config load. A plain
# `proxy_pass http://backend:8080;` resolves once on startup and refuses to
# start nginx at all if the backend container isn't up yet — this way the
# frontend container starts regardless of the other services' boot order.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /chat {
        set $ml_service http://ml-service:8000;
        proxy_pass $ml_service;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /health {
        set $ml_service http://ml-service:8000;
        proxy_pass $ml_service;
        proxy_set_header Host $host;
    }

    # Client-side routing: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
