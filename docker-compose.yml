# Brings up the full stack: Postgres, the Spring Boot backend, the FastAPI
# ML service, and the React frontend. Run `docker compose up --build` from
# hackathon/, then open http://localhost:5173.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-waypoint}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-waypoint}
      POSTGRES_DB: ${DB_NAME:-waypoint}
    ports:
      - "5432:5432"
    volumes:
      - waypoint_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-waypoint}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-waypoint}
      DB_USER: ${DB_USER:-waypoint}
      DB_PASSWORD: ${DB_PASSWORD:-waypoint}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-only-secret-key-please-replace-me-32chars+}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      SEED_DATA_DIR: /app/data/general_data
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    volumes:
      # Mounts the dataset into the container read-only, so the seed loader
      # can read it at the path SEED_DATA_DIR points to above.
      - ./data/general_data:/app/data/general_data:ro
    ports:
      - "8080:8080"

  ml-service:
    build: ./ml-service
    depends_on:
      - backend
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct}
      BACKEND_BASE_URL: http://backend:8080
      PORT: 8000
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
      - ml-service
    ports:
      - "5173:80"

volumes:
  waypoint_pgdata: